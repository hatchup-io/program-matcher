name: Build deck

on:
  push:
    branches: [main]
    paths:
      - 'deck/**'
      - '.github/workflows/build-deck.yml'
  pull_request:
    paths:
      - 'deck/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render PDF and HTML
        run: |
          mkdir -p build
          npx --yes @marp-team/marp-cli@latest deck/program-matcher.md \
            --pdf --allow-local-files -o build/program-matcher.pdf
          npx --yes @marp-team/marp-cli@latest deck/program-matcher.md \
            --html --allow-local-files -o build/program-matcher.html

      - uses: actions/upload-artifact@v4
        with:
          name: program-matcher-deck
          path: build/

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/program-matcher.pdf build/program-matcher.html --clobber
