name: Deck

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# One in-flight deploy at a time; a superseded run is cancelled rather than
# racing the one behind it onto the same URL.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Never run a fork's pull request on our own runner: that is arbitrary code
    # on our machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The PDF is printed by headless Chrome, which the hosted image had and
      # our runner does not. Marp finds it through CHROME_PATH.
      - uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Render deck
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mkdir -p site
          # The HTML deck IS the site root, so the Pages URL opens the
          # presentation itself rather than a landing page in front of it.
          npx --yes @marp-team/marp-cli@latest deck/program-matcher.md \
            --html --allow-local-files -o site/index.html
          npx --yes @marp-team/marp-cli@latest deck/program-matcher.md \
            --pdf --pdf-outlines --allow-local-files -o site/program-matcher.pdf

      # Reviewable on a PR, where there is no deployment to look at.
      - uses: actions/upload-artifact@v4
        with:
          name: program-matcher-deck
          path: site/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          path: site/

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            site/program-matcher.pdf --clobber --repo "$GITHUB_REPOSITORY"

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
